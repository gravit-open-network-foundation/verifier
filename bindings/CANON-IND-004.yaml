requirement_id: "CANON-IND-004"
title: "Records must be independently produced"
version: "1.0"
status: "normative"
kind: "constraint"

canonical_reference:
  - "Gravit Canon v1.1"
  - "VEDS-00 §4.6.2"
  - "GEVP-07 §10.4"

policy_obligation:
  description: >
    To reach COMMITTED, Records must be independently produced (distinct
    verifier-id, distinct provenance roots, no shared control plane). This
    Binding is a constraint: it can only demote a Verified Fact that was
    granted without real independence, never grant a state on its own.
  allowed_epistemic_states: []
  additional_constraints:
    - "Independent production required for Convergence"

verification_condition:
  required_verification_state: "COMMITTED"
  required_evidence:
    - "distinct verifier-id"
    - "distinct provenance roots"
  other_conditions:
    - "No shared control-plane signature"

decision_outcome:
  success: "no independent effect beyond confirming CANON-NAL-001"
  failure_states:
    - "REJECTED"
    - "DEGRADED"

traceability:
  must_link_to_evidence: true
  must_link_to_canon: true
  audit_level: "full"

notes: >
  Without independence, Convergence degenerates into collusion. Enforced as
  an explicit, separately auditable check, even though CANON-NAL-001's own
  GEVP evaluation already requires independent Records. Implementation:
  Records sharing a verifier-id or a provenance root, directly or through a
  chain of Records, are one source, represented by its lowest-theta Record.
