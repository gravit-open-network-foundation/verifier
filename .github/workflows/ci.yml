name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e . pytest jsonschema
      - name: Tests
        run: pytest -v
      - name: Golden vectors reproduce
        run: python tools/verify_golden.py
      - name: Golden vectors must be up to date
        run: |
          python tools/make_golden.py
          git diff --exit-code tests/golden

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and test against golden vectors
        working-directory: rust
        env:
          RUSTFLAGS: -D warnings
        run: cargo test
